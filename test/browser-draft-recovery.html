const until = async predicate => {

const key = id => keyForDraft(docId, 'sentence', id);
const draft = id => readDraft(key(id));
function fixture(text = '天人學', reading = '천인학') {

  open(id); return id;
}
function paste(value) {

  cells()[0].dispatchEvent(new ClipboardEvent('paste', { bubbles:true, cancelable:true, clipboardData:data }));
}
async function closeAndOpen(id, method = 'button') {
  if (method === 'escape') document.dispatchEvent(new KeyboardEvent('keydown', { key:'Escape', bubbles:true }));

  assert($('ec-overlay').classList.contains('hidden'), `${method} 닫기 실패`);

}

  assert($('ec-overlay').classList.contains('hidden'), `최종 저장 실패: ${$('ec-error').textContent}`);
}

async function startReload() {

  assert(['localhost', '127.0.0.1'].includes(location.hostname), '로컬 호스트에서만 허용');
  const marker = JSON.parse(sessionStorage.getItem(markerKey) || 'null');
  if (marker) {
    assert(JSON.stringify(snapshotUserData()) === JSON.stringify(marker.snapshot), '새로고침 사이 데이터 변경: 검사 중단');
    assert(JSON.stringify(Object.keys(localStorage).sort()) === JSON.stringify(marker.keys), '알 수 없는 저장 데이터: 검사 중단');
  } else {
    assert(Object.keys(snapshotUserData()).length === 0 && !localStorage.getItem(RECOVERY_KEY) && listDrafts().length === 0, '기존 사용자 데이터가 있습니다. 새 포트를 사용하세요.');
  }
  await acquireEditingSession(); await initStore(); initEditCard();
  if (marker) {
    docId = marker.docId; open(marker.id);
    assert($('ec-note').value === note, '실제 새로고침 후 입력 소실');
    assert(draft(marker.id)?.fields.note === note, '실제 새로고침 후 초안 소실');
    sessionStorage.removeItem(markerKey);
    $('result').textContent = ''; pass('실제 location.reload 후 문헌·카드·초안 복원');
  } else {
    $('result').textContent = '준비 완료 — 합성 표본만 사용\n'; $('suite').disabled = false;
  }
  $('suite').onclick = async () => {
    $('suite').disabled = true;
    try { await runSuite(); } catch (error) { $('result').textContent += `FAIL: ${error.message}\n`; }
  };
  $('reload-test').onclick = async () => {
    $('reload-test').disabled = true;
    try { await startReload(); } catch (error) { $('result').textContent += `FAIL: ${error.message}\n`; }
  };
} catch (error) { $('result').textContent = `중단: ${error.message}`; }
</script>
