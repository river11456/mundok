name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포 중인 산출물의 검증·출시 기록을 끝낸 뒤 다음 배포를 진행한다.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  release-policy:
    runs-on: ubuntu-latest
    outputs:
      product_changed: ${{ steps.policy.outputs.product_changed }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check release policy
        id: policy
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            base=$(git rev-parse HEAD^)
          else
            base="$BEFORE_SHA"
          fi
          node scripts/check-release.mjs --base "$base" --head HEAD > "$RUNNER_TEMP/release-policy.json"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/release-policy.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, 'product_changed=' + result.productChanged + '\nversion=' + result.version + '\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, result.productChanged
            ? '제품 변경: v' + result.version + ' 배포·검증 후 출시 기록 생성\n'
            : '문서·테스트·운영 도구 변경: 제품 배포와 버전 생성 생략\n');
          console.log(JSON.stringify(result, null, 2));
          NODE

  build:
    needs: release-policy
    if: needs.release-policy.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 90

  deploy:
    needs: [release-policy, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject superseded product versions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-policy.outputs.version }}
        run: |
          # 뒤에 문서 PR이 병합돼도 같은 제품 버전의 배포는 끝낼 수 있다.
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=main" --jq '.content | @base64d | fromjson | .version')
          test "$current" = "$VERSION"
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [release-policy, build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: release-artifact
      - name: Verify published files
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          VERSION: ${{ needs.release-policy.outputs.version }}
        run: node scripts/verify-deployment.mjs "$PAGE_URL" "$VERSION" "$GITHUB_SHA"
      - name: Record immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-policy.outputs.version }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          tag="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const { VERSION, GITHUB_SHA, GITHUB_SERVER_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID, PAGE_URL, RUNNER_TEMP } = process.env;
          writeFileSync(RUNNER_TEMP + '/release-notes.md', [
            '문독 ' + VERSION, '',
            '- 커밋: ' + GITHUB_SHA,
            '- [배포 및 검사 기록](' + GITHUB_SERVER_URL + '/' + GITHUB_REPOSITORY + '/actions/runs/' + GITHUB_RUN_ID + ')',
            '- [서비스](' + PAGE_URL + ')',
            '- 자동 검증: 데이터 검사, 타입 검사, 빌드, 테스트, 운영 HTML·서비스워커의 해시와 버전·커밋 일치.',
            '- 첨부 artifact.tar는 이 검사에 사용한 실제 배포 산출물입니다.',
            '- 실제 기기 사용 흐름·사용자 데이터 복원은 관련 작업에서 별도로 확인합니다. 이 기록만으로 해당 검증을 완료 처리하지 않습니다.',
            '',
          ].join('\n'));
          NODE
          # 기존 태그/Release는 수정하지 않는다. 같은 커밋의 재실행만 허용한다.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx artifact.tar
          else
            gh release create "$tag" release-artifact/artifact.tar --repo "$GITHUB_REPOSITORY" --verify-tag --title "문독 $tag" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi
